name: cron-audit

on:
  workflow_dispatch:
  schedule:
    - cron: "*/3 * * * *"
jobs:
  audit-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup PHP with composer v2
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2


      - name: composer validate
        run: composer validate

      - name: composer audit
        run: composer audit